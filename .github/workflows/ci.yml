name: Application CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: secure-cloud-platform

jobs:
  validate-application:
    name: Build, scan and test microservices
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Node.js dependencies
        run: |
          npm ci --prefix services/auth-service
          npm ci --prefix services/orders-service
          npm ci --prefix services/notifications-service

      - name: Build containers
        run: docker compose build

      - name: Scan auth image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secure-cloud-platform-auth-service:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan orders image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secure-cloud-platform-orders-service:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan notifications image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secure-cloud-platform-notifications-service:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Start stack
        run: docker compose up -d

      - name: Run health checks
        run: bash tests/health-checks.sh

      - name: Run security checks
        run: bash tests/security-tests.sh

      - name: Run integration checks
        run: bash tests/integration-tests.sh

      - name: Stop stack
        if: always()
        run: docker compose down -v
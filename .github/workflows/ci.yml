name: Application CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: secure-cloud-platform

jobs:
  validate-application:
    name: Build, scan and test microservices
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Node.js dependencies
        run: |
          npm ci --prefix services/auth-service
          npm ci --prefix services/orders-service
          npm ci --prefix services/notifications-service

      - name: Generate ephemeral CI secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Build containers
        run: docker compose build

      - name: Audit Node.js dependencies
        run: |
          npm audit --audit-level=high --prefix services/auth-service
          npm audit --audit-level=high --prefix services/orders-service
          npm audit --audit-level=high --prefix services/notifications-service

      - name: Start stack
        run: docker compose up -d

      - name: Wait for API services
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/health >/dev/null \
              && curl --fail --silent http://localhost:3001/health >/dev/null \
              && curl --fail --silent http://localhost:3002/health >/dev/null; then
              echo "All API services are healthy"
              exit 0
            fi
            echo "Waiting for API services (attempt $attempt/30)"
            sleep 2
          done
          docker compose ps
          exit 1

      - name: Run health checks
        run: bash tests/health-checks.sh

      - name: Run security checks
        run: bash tests/security-tests.sh

      - name: Run integration checks
        run: bash tests/integration-tests.sh

      - name: Stop stack
        if: always()
        run: docker compose down -v
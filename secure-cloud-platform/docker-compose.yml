services:

  postgres:
    image: postgres:16-alpine
    container_name: secure-platform-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secure_platform}
      POSTGRES_USER: ${POSTGRES_USER:-secure_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_platform_dev_password}
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: secure-platform-redis
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    restart: unless-stopped
    networks:
      - frontend
      - backend
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-secure_platform}:${POSTGRES_PASSWORD:-secure_platform_dev_password}@postgres:5432/${POSTGRES_DB:-secure_platform}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting the stack}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3000:3000"

  orders-service:
    build: ./services/orders-service
    container_name: orders-service
    restart: unless-stopped
    networks:
      - frontend
      - backend
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-secure_platform}:${POSTGRES_PASSWORD:-secure_platform_dev_password}@postgres:5432/${POSTGRES_DB:-secure_platform}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting the stack}
      NOTIFICATIONS_URL: http://notifications-service:3002
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      notifications-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3001:3001"

  notifications-service:
    build: ./services/notifications-service
    container_name: notifications-service
    restart: unless-stopped
    networks:
      - frontend
      - backend
    environment:
      PORT: 3002
      DATABASE_URL: postgres://${POSTGRES_USER:-secure_platform}:${POSTGRES_PASSWORD:-secure_platform_dev_password}@postgres:5432/${POSTGRES_DB:-secure_platform}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3002:3002"

volumes:
  postgres-data:
  redis-data:

networks:
  frontend:
  backend:
    internal: true
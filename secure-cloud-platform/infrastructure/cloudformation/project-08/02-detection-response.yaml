AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Project 8 - Stack 2/2 - Detection and automated response. Enables GuardDuty
  and Security Hub, deploys AWS Config rules with SSM auto-remediation, and
  wires high-severity findings to a containment Lambda through EventBridge.

  Depends on the exports of 01-foundation.yaml.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Stack wiring
        Parameters:
          - FoundationStackName
          - ProjectName
      - Label:
          default: Response behaviour
        Parameters:
          - QuarantineVpcId
          - AutoContainmentEnabled

Parameters:

  FoundationStackName:
    Type: String
    Default: securecloud-foundation
    Description: Name of the deployed foundation stack whose outputs are imported.

  ProjectName:
    Type: String
    Default: securecloud
    AllowedPattern: '[a-z0-9-]+'

  QuarantineVpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC in which the quarantine security group is created.

  AutoContainmentEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      When false, the response Lambda notifies but does not isolate the
      instance. Useful while tuning detections to avoid disrupting production
      on a false positive.

Resources:

  # ------------------------------------------------------------ Detection ---

  GuardDutyDetector:
    Type: AWS::GuardDuty::Detector
    Properties:
      Enable: true
      FindingPublishingFrequency: FIFTEEN_MINUTES
      DataSources:
        S3Logs:
          Enable: true
        Kubernetes:
          AuditLogs:
            Enable: false
        MalwareProtection:
          ScanEc2InstanceWithFindings:
            EbsVolumes: true

  SecurityHubAccount:
    Type: AWS::SecurityHub::Hub
    Properties:
      Tags:
        Project: !Ref ProjectName

  CisStandard:
    Type: AWS::SecurityHub::Standard
    DependsOn: SecurityHubAccount
    Properties:
      StandardsArn: !Sub 'arn:aws:securityhub:${AWS::Region}::standards/cis-aws-foundations-benchmark/v/1.4.0'

  FoundationalStandard:
    Type: AWS::SecurityHub::Standard
    DependsOn: SecurityHubAccount
    Properties:
      StandardsArn: !Sub 'arn:aws:securityhub:${AWS::Region}::standards/aws-foundational-security-best-practices/v/1.0.0'

  # ---------------------------------------------------------- Config rules ---
  # Detection alone leaves a human in the remediation path. Each rule below
  # that can be safely auto-fixed is paired with an SSM Automation document.

  RestrictedSshRule:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: restricted-ssh
      Description: Security groups must not allow unrestricted inbound SSH.
      Source:
        Owner: AWS
        SourceIdentifier: INCOMING_SSH_DISABLED
      Scope:
        ComplianceResourceTypes:
          - AWS::EC2::SecurityGroup

  RestrictedSshRemediation:
    Type: AWS::Config::RemediationConfiguration
    Properties:
      ConfigRuleName: !Ref RestrictedSshRule
      TargetType: SSM_DOCUMENT
      TargetId: AWS-DisablePublicAccessForSecurityGroup
      Automatic: true
      MaximumAutomaticAttempts: 3
      RetryAttemptSeconds: 60
      Parameters:
        GroupId:
          ResourceValue:
            Value: RESOURCE_ID
        AutomationAssumeRole:
          StaticValue:
            Values:
              - !GetAtt RemediationRole.Arn

  S3PublicReadRule:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: s3-bucket-public-read-prohibited
      Description: S3 buckets must not be publicly readable.
      Source:
        Owner: AWS
        SourceIdentifier: S3_BUCKET_PUBLIC_READ_PROHIBITED
      Scope:
        ComplianceResourceTypes:
          - AWS::S3::Bucket

  EncryptedVolumesRule:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: encrypted-volumes
      Description: EBS volumes must be encrypted with a KMS key.
      Source:
        Owner: AWS
        SourceIdentifier: ENCRYPTED_VOLUMES
      Scope:
        ComplianceResourceTypes:
          - AWS::EC2::Volume

  RdsEncryptionRule:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: rds-storage-encrypted
      Description: RDS instances must have encrypted storage.
      Source:
        Owner: AWS
        SourceIdentifier: RDS_STORAGE_ENCRYPTED
      Scope:
        ComplianceResourceTypes:
          - AWS::RDS::DBInstance

  IamPasswordPolicyRule:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: iam-password-policy
      Description: Account password policy must meet CIS requirements.
      Source:
        Owner: AWS
        SourceIdentifier: IAM_PASSWORD_POLICY
      InputParameters:
        RequireUppercaseCharacters: 'true'
        RequireLowercaseCharacters: 'true'
        RequireNumbers: 'true'
        RequireSymbols: 'true'
        MinimumPasswordLength: '14'
        PasswordReusePrevention: '24'
        MaxPasswordAge: '90'

  CloudTrailEnabledRule:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cloudtrail-enabled
      Description: At least one multi-region trail must be logging.
      Source:
        Owner: AWS
        SourceIdentifier: CLOUD_TRAIL_ENABLED

  RootMfaRule:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: root-account-mfa-enabled
      Description: The root user must have MFA enabled.
      Source:
        Owner: AWS
        SourceIdentifier: ROOT_ACCOUNT_MFA_ENABLED

  # ---------------------------------------------------- Remediation role ---
  # Scoped to exactly the actions the automation performs. An over-permissive
  # remediation role is itself an attack path: it is invoked by an event that
  # an attacker may be able to influence.

  RemediationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-config-remediation'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SecurityGroupRemediation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeSecurityGroups
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:UpdateSecurityGroupRuleDescriptionsIngress
                Resource: '*'

  # ------------------------------------------------- Containment function ---

  QuarantineSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W40
            reason: Quarantine group intentionally has no egress rules.
          - id: W5
            reason: Quarantine group intentionally has no egress rules.
    Properties:
      GroupName: !Sub '${ProjectName}-quarantine'
      GroupDescription: >
        No ingress and no egress. Attaching this group to a compromised
        instance severs its network access while preserving the running state
        for forensic capture.
      VpcId: !Ref QuarantineVpcId
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
          Description: Deny-all placeholder, loopback only
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-quarantine'

  ContainmentFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ContainCompromisedInstance
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InspectAndIsolate
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeVolumes
                  - ec2:ModifyInstanceAttribute
                  - ec2:CreateSnapshot
                  - ec2:CreateTags
                Resource: '*'
              - Sid: NotifyAndRecord
                Effect: Allow
                Action: sns:Publish
                Resource:
                  Fn::ImportValue: !Sub '${FoundationStackName}-SecurityAlertsTopicArn'
              - Sid: UpdateFindingWorkflow
                Effect: Allow
                Action: securityhub:BatchUpdateFindings
                Resource: '*'

  ContainmentFunction:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Function acts on account-wide events and needs no VPC attachment.
          - id: W92
            reason: Reserved concurrency deliberately unset; findings are bursty.
    Properties:
      FunctionName: !Sub '${ProjectName}-containment'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt ContainmentFunctionRole.Arn
      Environment:
        Variables:
          QUARANTINE_SG: !Ref QuarantineSecurityGroup
          TOPIC_ARN:
            Fn::ImportValue: !Sub '${FoundationStackName}-SecurityAlertsTopicArn'
          CONTAINMENT_ENABLED: !Ref AutoContainmentEnabled
      Code:
        ZipFile: |
          """Contain an EC2 instance implicated in a high-severity finding.

          Order of operations matters: snapshot first, then isolate. Isolating
          a live instance can cause the workload to terminate itself, and the
          volume state at the moment of detection is the evidence.
          """
          import os
          import json
          import boto3

          ec2 = boto3.client("ec2")
          sns = boto3.client("sns")
          hub = boto3.client("securityhub")

          QUARANTINE_SG = os.environ["QUARANTINE_SG"]
          TOPIC_ARN = os.environ["TOPIC_ARN"]
          ENABLED = os.environ.get("CONTAINMENT_ENABLED", "true").lower() == "true"


          def extract_instance_id(finding):
              for resource in finding.get("Resources", []):
                  if resource.get("Type") == "AwsEc2Instance":
                      return resource["Id"].rsplit("/", 1)[-1]
              return None


          def snapshot_volumes(instance_id):
              volumes = ec2.describe_volumes(
                  Filters=[{"Name": "attachment.instance-id", "Values": [instance_id]}]
              )["Volumes"]
              snapshots = []
              for volume in volumes:
                  snap = ec2.create_snapshot(
                      VolumeId=volume["VolumeId"],
                      Description=f"Forensic capture for {instance_id}",
                      TagSpecifications=[{
                          "ResourceType": "snapshot",
                          "Tags": [
                              {"Key": "incident", "Value": "true"},
                              {"Key": "sourceInstance", "Value": instance_id},
                          ],
                      }],
                  )
                  snapshots.append(snap["SnapshotId"])
              return snapshots


          def isolate(instance_id):
              ec2.modify_instance_attribute(
                  InstanceId=instance_id, Groups=[QUARANTINE_SG]
              )
              ec2.create_tags(
                  Resources=[instance_id],
                  Tags=[{"Key": "incident", "Value": "true"}],
              )


          def handler(event, context):
              findings = event.get("detail", {}).get("findings", [])
              actions = []

              for finding in findings:
                  title = finding.get("Title", "unknown finding")
                  severity = finding.get("Severity", {}).get("Label", "UNKNOWN")
                  instance_id = extract_instance_id(finding)

                  if not instance_id:
                      actions.append(f"{title}: no EC2 resource, notification only")
                      continue

                  snapshots = snapshot_volumes(instance_id)

                  if ENABLED:
                      isolate(instance_id)
                      actions.append(
                          f"{title} [{severity}]: {instance_id} isolated, "
                          f"snapshots {', '.join(snapshots) or 'none'}"
                      )
                  else:
                      actions.append(
                          f"{title} [{severity}]: containment disabled, "
                          f"snapshots {', '.join(snapshots) or 'none'}"
                      )

              if actions:
                  sns.publish(
                      TopicArn=TOPIC_ARN,
                      Subject="Automated containment executed",
                      Message="\n".join(actions),
                  )

              return {"statusCode": 200, "body": json.dumps(actions)}

  # ------------------------------------------------------------ Event wiring ---

  HighSeverityFindingRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-high-severity-findings'
      Description: Route new HIGH and CRITICAL Security Hub findings to containment.
      EventPattern:
        source:
          - aws.securityhub
        detail-type:
          - Security Hub Findings - Imported
        detail:
          findings:
            Severity:
              Label:
                - HIGH
                - CRITICAL
            Workflow:
              Status:
                - NEW
      State: ENABLED
      Targets:
        - Id: ContainmentFunction
          Arn: !GetAtt ContainmentFunction.Arn
        - Id: SecurityTeamNotification
          Arn:
            Fn::ImportValue: !Sub '${FoundationStackName}-SecurityAlertsTopicArn'

  ContainmentInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ContainmentFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt HighSeverityFindingRule.Arn

  # Root usage is not a "finding" anywhere else; CIS requires alerting on it
  # explicitly, so it gets its own rule straight off the CloudTrail stream.
  RootActivityRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-root-activity'
      Description: Alert on any use of the root account.
      EventPattern:
        detail-type:
          - AWS API Call via CloudTrail
          - AWS Console Sign In via CloudTrail
        detail:
          userIdentity:
            type:
              - Root
      State: ENABLED
      Targets:
        - Id: SecurityTeamNotification
          Arn:
            Fn::ImportValue: !Sub '${FoundationStackName}-SecurityAlertsTopicArn'

Outputs:

  GuardDutyDetectorId:
    Description: Detector id, used to generate sample findings during testing
    Value: !Ref GuardDutyDetector

  ContainmentFunctionName:
    Description: Lambda invoked on high-severity findings
    Value: !Ref ContainmentFunction

  QuarantineSecurityGroupId:
    Description: Security group attached to contained instances
    Value: !Ref QuarantineSecurityGroup

  RemediationRoleArn:
    Description: Role assumed by SSM Automation for Config remediation
    Value: !GetAtt RemediationRole.Arn
